name: npm-publish

on:
  release:
    types: [published]

  workflow_dispatch:

# Required for NPM trusted publishing with OIDC
permissions:
  id-token: write  # Required for OIDC
  contents: read
    
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        nodever: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.nodever }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - name: Setup Vercel endpoint
        id: vercel
        # Don't block tests if Vercel is unavailable - tests will run without Vercel-specific assertions
        continue-on-error: true
        uses: ./.github/actions/setup-vercel-endpoint
        with:
          vercel-endpoint-override: ${{ secrets.VERCEL_ENDPOINT }}
          branch-name: ${{ github.ref_name }}

      - name: Test
        run: npm test -- test/cloud.test.ts
        timeout-minutes: 10
        env:
          SPICEAI_API_KEY: ${{ secrets.SPICEAI_API_KEY }}
          SCP_SPICEAI_TPCH_API_KEY: ${{ secrets.SCP_SPICEAI_TPCH_API_KEY }}
          HTTP_URL: ${{ secrets.HTTP_URL || 'https://data.spiceai.io' }}
          FLIGHT_URL: ${{ secrets.FLIGHT_URL || 'flight.spiceai.io:443' }}
          VERCEL_ENDPOINT: ${{ steps.vercel.outputs.vercel-api-endpoint }}

  publish-npm:
    needs: build
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - run: npm ci
      - run: node scripts/update-version.js # ensure the version in version.ts is updated
      - run: npm run build
      - run: npm install -g npm@latest  # Upgrade to npm >= 11.5.1 for OIDC trusted publishing
      - run: npm --version  # Verify npm version
      - run: npm publish --access public  # OIDC authentication happens automatically
