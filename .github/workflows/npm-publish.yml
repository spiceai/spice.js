name: npm-publish

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        nodever: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.nodever }}
      - run: npm install
      - run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - name: Setup Vercel endpoint
        id: vercel
        uses: ./.github/actions/setup-vercel-endpoint
        with:
          vercel-endpoint-override: ${{ secrets.VERCEL_ENDPOINT }}
          vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          branch-name: ${{ github.ref_name }}

      - name: Test
        run: npm test
        timeout-minutes: 10
        env:
          SPICE_API_KEY: ${{ secrets.SPICE_API_KEY }}

  publish-npm:
    needs: build
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: node scripts/update-version.js # ensure the version in version.ts is updated
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
