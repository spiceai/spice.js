name: test

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
      - release-*
    tags:
      - v*

  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 18
          - 20
          - 22
          - 24
    name: Test with spice runtime on ${{ matrix.os }} Node.JS ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install requirements
        run: |
          npm install
          npm run build

      - name: Install PostgreSQL (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sleep 5
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='postgres'" | grep -q 1 || sudo -u postgres createuser -s postgres
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb testdb

      - name: Install PostgreSQL (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install postgresql
          brew services start postgresql
          sleep 5
          createuser -s postgres
          psql -d postgres -c "ALTER USER postgres PASSWORD 'postgres';"
          createdb testdb

      - name: Wait for PostgreSQL to start
        run: sleep 5

      - name: Check PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'SELECT version();'

      - name: Prepare PostgreSQL dataset
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d testdb < test/scripts/setup-data-postgresql.sql
          psql -h localhost -U postgres -d testdb -c 'SELECT * FROM test_postgresql_table;'

      - name: Install Spice (https://install.spiceai.org) (Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://install.spiceai.org | /bin/bash
          echo "$HOME/.spice/bin" >> $GITHUB_PATH
          $HOME/.spice/bin/spice install

      - name: Check spice version
        run: spice version

      - name: Start spice runtime
        env:
          SPICE_SECRET_POSTGRES_PASSWORD: postgres
        working-directory: test/scripts
        run: |
          spiced &> spice.log &
          # time to initialize added dataset
          sleep 2

      - name: Running local tests
        run: |
          npm run test
        env:
          SPICEAI_API_KEY: ${{ secrets.SPICEAI_API_KEY }}

      - name: Construct Vercel endpoint
        id: vercel-endpoint
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"

          # Replace / with - and convert to lowercase for Vercel format
          BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')

          # Construct the Vercel endpoint using organization name 'spice'
          VERCEL_ENDPOINT="https://spice-js-git-${BRANCH_SLUG}-spice.vercel.app"

          echo "vercel_endpoint=${VERCEL_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "Constructed Vercel endpoint: ${VERCEL_ENDPOINT}"

      - name: Wait for Vercel deployment to be ready
        env:
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          VERCEL_ENDPOINT="${{ secrets.VERCEL_ENDPOINT || steps.vercel-endpoint.outputs.vercel_endpoint }}"
          HEALTH_URL="${VERCEL_ENDPOINT}/health"

          echo "Waiting for Vercel endpoint to be ready: ${HEALTH_URL}"

          MAX_ATTEMPTS=30
          ATTEMPT=0

          # Prepare curl header args if bypass secret is set
          CURL_HEADERS=""
          if [ -n "${VERCEL_BYPASS_SECRET}" ]; then
            CURL_HEADERS="-H 'x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}'"
          fi

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: Checking ${HEALTH_URL}"
            
            # Get both status code and response body
            RESPONSE=$(eval "curl -s -w '\n%{http_code}' ${CURL_HEADERS} '${HEALTH_URL}'" || echo -e "\n000")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -q "ok"; then
              echo "✓ Vercel endpoint is ready (HTTP ${HTTP_CODE}, body contains 'ok')"
              exit 0
            fi
            
            echo "  HTTP ${HTTP_CODE}, body: ${BODY} - Not ready yet, waiting 10 seconds..."
            sleep 10
          done

          echo "✗ Vercel endpoint did not become ready after ${MAX_ATTEMPTS} attempts"
          echo "  This may indicate the deployment is not available or the branch/author format is incorrect"
          exit 1

      - name: Running cloud tests
        run: |
          npm run test -- test/cloud.test.ts
        env:
          SPICEAI_API_KEY: ${{ secrets.SPICEAI_API_KEY }} # spice.ai/spiceai/spice-js
          HTTP_URL: ${{ secrets.HTTP_URL || 'https://data.spiceai.io' }}
          FLIGHT_URL: ${{ secrets.FLIGHT_URL || 'flight.spiceai.io:443' }}
          VERCEL_ENDPOINT: ${{ secrets.VERCEL_ENDPOINT || steps.vercel-endpoint.outputs.vercel_endpoint }}/api
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Stop spice and check logs
        if: always()
        run: |
          killall spice || true
          cat test/scripts/spice.log
          killall spice || true
          cat test/scripts/spice.log
